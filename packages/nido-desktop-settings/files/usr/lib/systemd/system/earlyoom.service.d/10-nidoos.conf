# NidoOS earlyoom policy: protect GNOME desktop session & core system daemons;
# prefer reclaiming runaway local LLM / browser / office memory under OOM pressure.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 5 -s 5 --avoid '^(systemd|init|gdm|gnome-shell|mutter|Xwayland|pipewire|wireplumber|dbus-daemon|dbus-broker|NetworkManager|sshd)' --prefer '(ollama|llama-server|nidooffice|Isolated.Web.Co|Web.Content|chromium|chrome|electron)'
