<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Ubuntu-Nido Vietnamese Typography & Fontconfig Priority Rules
  Ensures complete Vietnamese diacritic coverage (including U+1EA0..U+1EF9 such as ệ, ế, ộ, ự)
  across the Live Installer (ubuntu-desktop-bootstrap), GDM, GNOME Shell, GTK4, Electron, and CLI.
  Canonical's Ubuntu / Ubuntu Sans fonts omit 86-88 Vietnamese Extended-Additional codepoints;
  preferring Be Vietnam Pro (static TTF) -> Noto Sans guarantees uniform glyph rendering everywhere.
-->
<fontconfig>
  <!-- Reject Canonical's Ubuntu/Ubuntu Sans/Ubuntu Mono TTFs that omit 88 Vietnamese
       precomposed glyphs plus combining hook-above (U+0309) and dot-below (U+0323),
       ensuring Skia/Flutter (ubuntu-desktop-bootstrap log console), GTK, and Electron
       never match them directly and always use full-Vietnamese fonts instead. -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/truetype/ubuntu/*</glob>
    </rejectfont>
  </selectfont>

  <!-- Ensure smooth rendering for stacked Vietnamese diacritics -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>

  <!-- Map Ubuntu / Ubuntu Sans / Cantarell to full-Vietnamese Be Vietnam Pro + Noto Sans -->
  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Be Vietnam Pro</string>
      <string>Noto Sans</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu Sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Be Vietnam Pro</string>
      <string>Noto Sans</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu Sans Variable</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Be Vietnam Pro</string>
      <string>Noto Sans</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Cantarell</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Be Vietnam Pro</string>
      <string>Noto Sans</string>
    </edit>
  </match>

  <!-- Generic sans-serif & system-ui families -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Be Vietnam Pro</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Be Vietnam Pro</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>ui-sans-serif</family>
    <prefer>
      <family>Be Vietnam Pro</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <!-- Serif family with full Vietnamese diacritics -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>

  <!-- Monospace families (Ubuntu Mono omits 88 Vietnamese glyphs + U+0309/U+0323;
       Ubuntu's fonts-noto-mono registers family "Noto Mono" with 134/134 Vietnamese) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu Mono</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Mono</string>
      <string>Liberation Mono</string>
      <string>Noto Sans Mono</string>
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>UbuntuMono</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Mono</string>
      <string>Liberation Mono</string>
      <string>Noto Sans Mono</string>
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>Ubuntu Sans Mono</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Mono</string>
      <string>Liberation Mono</string>
      <string>Noto Sans Mono</string>
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Mono</family>
      <family>Liberation Mono</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
