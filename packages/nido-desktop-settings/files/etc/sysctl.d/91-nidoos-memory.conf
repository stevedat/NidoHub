# NidoOS Desktop Memory, ZRAM & Writeback Policy
# Tuned for zstd-compressed zram swap (systemd-zram-generator) and NVMe/SSD
# storage on 4-32+ GiB desktops and VMs: favors compressing cold anonymous pages
# into zram without thrashing disk swap, disables 8-page HDD swap readahead on
# zram, smooths background kswapd reclamation, starts dirty writeback early to
# avoid I/O stalls, and retains VFS dentry/inode cache longer for fast app reopen.

vm.swappiness = 100
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50
