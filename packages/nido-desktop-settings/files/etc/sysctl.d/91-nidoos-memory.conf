# NidoOS Desktop Memory & ZRAM Compression Policy
# Tuned for zstd-compressed zram swap (systemd-zram-generator) on 4-16+ GiB
# desktops and VMs: favors compressing cold anonymous pages into zram without
# thrashing disk swap, disables 8-page HDD swap readahead on zram, and smooths
# background kswapd reclamation to avoid UI micro-stutters.

vm.swappiness = 100
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
