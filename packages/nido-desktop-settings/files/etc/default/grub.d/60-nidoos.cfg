# NidoOS Desktop kernel tuning: disable soft/hard lockup watchdog timers
# to reduce periodic idle wakeups and free a hardware PMU counter.
case " ${GRUB_CMDLINE_LINUX_DEFAULT:-} " in
  *" nowatchdog "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }nowatchdog" ;;
esac
