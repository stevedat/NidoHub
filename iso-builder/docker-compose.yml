services:
  builder:
    build: .
    working_dir: /workspace/iso-builder
    privileged: true
    stdin_open: true
    tty: true
    environment:
      CI: "1"
      DEBIAN_FRONTEND: noninteractive
      APT_LOCK_TIMEOUT: "600"
      TARGET_ARCH: "${TARGET_ARCH:-amd64}"
      UBUNTU_VERSION: "${UBUNTU_VERSION:-26.04}"
      NIDO_VERSION: "${NIDO_VERSION:-0.1.0}"
    volumes:
      - ..:/workspace
      - /dev:/dev
    command: /bin/bash
