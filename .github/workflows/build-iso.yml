name: Build Ubuntu-Nido ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Base Ubuntu LTS version"
        required: true
        default: "26.04"
        type: choice
        options:
          - "26.04"
          - "24.04"
      arch:
        description: "Target architecture"
        required: true
        default: "amd64"
        type: choice
        options:
          - "amd64"
          - "arm64"
          - "both"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ARCH: ${{ inputs.arch || 'both' }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INPUT_ARCH" = "both" ]; then
            MATRIX='{"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}'
          elif [ "$INPUT_ARCH" = "arm64" ]; then
            MATRIX='{"include":[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}'
          else
            MATRIX='{"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      UBUNTU_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ubuntu_version || '26.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso rsync wget curl dpkg-dev python3 p7zip-full
          if [ "${TARGET_ARCH}" = "amd64" ]; then
            sudo apt-get install -y isolinux syslinux-utils grub-pc-bin
          fi

      - name: Build assets, .deb packages & static APT repo
        run: make assets packages apt-repo

      - name: Build Ubuntu-Nido ISO
        run: |
          cd iso-builder
          NIDO_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$NIDO_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            NIDO_VERSION="0.1.0"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            sudo -E NIDO_VERSION="$NIDO_VERSION" ./build.sh --release
          else
            sudo -E NIDO_VERSION="$NIDO_VERSION" ./build.sh
          fi

      - name: Record ISO checksum
        run: |
          ISO_PATH="iso-builder/Ubuntu-Nido-desktop-${{ matrix.arch }}.iso"
          ISO_SIZE="$(du -h "$ISO_PATH" | cut -f1)"
          ISO_SHA="$(sha256sum "$ISO_PATH" | cut -d' ' -f1)"
          {
            echo "### Ubuntu-Nido ISO (${{ matrix.arch }})"
            echo "- File: \`Ubuntu-Nido-desktop-${{ matrix.arch }}.iso\`"
            echo "- Size: \`${ISO_SIZE}\`"
            echo "- SHA256: \`${ISO_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-nido-iso-${{ matrix.arch }}
          path: iso-builder/Ubuntu-Nido-desktop-${{ matrix.arch }}.iso
          compression-level: 0
          retention-days: 7

      - name: Upload static APT repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-nido-apt-repo-${{ matrix.arch }}
          path: apt-repo/**
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download ISO artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ubuntu-nido-iso-*
          path: release-assets
          merge-multiple: true

      - name: Generate installer-only SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum Ubuntu-Nido-desktop-*.iso > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/Ubuntu-Nido-desktop-*.iso
            release-assets/SHA256SUMS.txt
