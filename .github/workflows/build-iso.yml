name: Build NidoOS ISO

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Base Ubuntu LTS version"
        required: true
        default: "26.04"
        type: choice
        options:
          - "26.04"
          - "24.04"
      arch:
        description: "Target architecture"
        required: true
        default: "amd64"
        type: choice
        options:
          - "amd64"
          - "arm64"
          - "both"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ARCH: ${{ inputs.arch || 'both' }}
        run: |
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$INPUT_ARCH" = "both" ]; then
            MATRIX='{"include":[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}'
          elif [ "$INPUT_ARCH" = "arm64" ]; then
            MATRIX='{"include":[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]}'
          else
            MATRIX='{"include":[{"arch":"amd64","runner":"ubuntu-24.04"}]}'
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      UBUNTU_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ubuntu_version || '26.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet &
          sudo rm -rf /usr/local/lib/android &
          sudo rm -rf /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL &
          wait
          docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso rsync wget curl dpkg-dev python3 p7zip-full zstd rclone
          if [ "${TARGET_ARCH}" = "amd64" ]; then
            sudo apt-get install -y isolinux syslinux-utils grub-pc-bin qemu-system-x86
          else
            sudo apt-get install -y qemu-system-arm
          fi

      - name: Build assets, .deb packages (Stage 1 + Stage 2 native on 26.04) & static APT repo
        run: |
          make assets packages
          if [ "${UBUNTU_VERSION}" = "26.04" ]; then
            echo "==> Building Stage 2 native Cython .so + Node 22 SEA ELF for ${TARGET_ARCH}..."
            APT_GPG_KEY="" bash scripts/native-build/build_native_debs.sh --arch "${TARGET_ARCH}"
            python3 scripts/build_apt_repo.py --dist-dir packages/dist --vendor-dir packages/vendor --native-dir packages/dist/native --out-dir apt-repo
          else
            python3 scripts/build_apt_repo.py --dist-dir packages/dist --vendor-dir packages/vendor --out-dir apt-repo
          fi

      - name: Build NidoOS ISO
        run: |
          cd iso-builder
          NIDO_VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$NIDO_VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            NIDO_VERSION="0.2.0"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            sudo -E NIDO_VERSION="$NIDO_VERSION" ./build.sh --release
          else
            sudo -E NIDO_VERSION="$NIDO_VERSION" ./build.sh
          fi

      - name: Verify ISO Live Boot in QEMU
        run: |
          set -euo pipefail
          ISO_PATH="iso-builder/NidoOS-desktop-${{ matrix.arch }}.iso"
          TMP_BOOT="$(mktemp -d)"
          MNT_DIR="$TMP_BOOT/mnt"
          BOOT_LOG="$TMP_BOOT/boot.log"
          QEMU_PID=""
          cleanup_qemu() {
            if [ -n "$QEMU_PID" ] && kill -0 "$QEMU_PID" 2>/dev/null; then
              kill -9 "$QEMU_PID" 2>/dev/null || true
            fi
            sudo umount "$MNT_DIR" 2>/dev/null || true
            rm -rf "$TMP_BOOT"
          }
          trap cleanup_qemu EXIT

          mkdir -p "$MNT_DIR"
          sudo mount -o loop,ro "$ISO_PATH" "$MNT_DIR"

          grep -q "NidoOS" "$MNT_DIR/boot/grub/grub.cfg"
          if grep -q "NidoOS-Nido" "$MNT_DIR/boot/grub/grub.cfg"; then
            echo "ERROR: Duplicate NidoOS-Nido string found in grub.cfg" >&2
            exit 1
          fi
          for req in \
            casper/vmlinuz \
            casper/initrd \
            casper/minimal.squashfs \
            casper/minimal.standard.squashfs \
            casper/minimal.standard.live.squashfs \
            casper/install-sources.yaml \
            .disk/info \
            .disk/casper-uuid-generic; do
            test -s "$MNT_DIR/$req" || { echo "ERROR: Missing or empty $req in ISO" >&2; exit 1; }
          done
          grep -Eq "^NidoOS [0-9]+\.[0-9]+(\.[0-9]+)? LTS \"[^\"]+\" - Release ${TARGET_ARCH} \([0-9]{8}\)\$" "$MNT_DIR/.disk/info" || {
            echo "ERROR: Invalid .disk/info format: $(cat "$MNT_DIR/.disk/info")" >&2
            exit 1
          }
          grep -qa "etc/nidoos-initrd-branded" "$MNT_DIR/casper/initrd" || {
            echo "ERROR: casper/initrd is missing NidoOS Plymouth branding CPIO overlay" >&2
            exit 1
          }
          (cd "$MNT_DIR" && md5sum -c --quiet md5sum.txt) || {
            echo "ERROR: ISO md5sum.txt verification failed" >&2
            exit 1
          }
          grep -q "locale_support: locale-only" "$MNT_DIR/casper/install-sources.yaml"
          if grep -q "^sources:" "$MNT_DIR/casper/install-sources.yaml"; then
            grep -q "^version: 2" "$MNT_DIR/casper/install-sources.yaml"
          fi
          if grep -q "minimal.enhanced-secureboot.squashfs" "$MNT_DIR/casper/install-sources.yaml"; then
            echo "ERROR: Stale minimal.enhanced-secureboot.squashfs remained in install-sources.yaml" >&2
            exit 1
          fi
          SFS_BYTES="$(stat -c%s "$MNT_DIR/casper/minimal.squashfs")"
          grep -q "size: ${SFS_BYTES}\$" "$MNT_DIR/casper/install-sources.yaml" || {
            echo "ERROR: install-sources.yaml size mismatch for minimal.squashfs ($SFS_BYTES bytes)" >&2
            exit 1
          }

          cp "$MNT_DIR/casper/vmlinuz" "$TMP_BOOT/vmlinuz"
          cp "$MNT_DIR/casper/initrd" "$TMP_BOOT/initrd"
          chmod 644 "$TMP_BOOT/vmlinuz" "$TMP_BOOT/initrd"
          sudo umount "$MNT_DIR"

          if [ "${TARGET_ARCH}" = "arm64" ]; then
            python3 - "$TMP_BOOT/vmlinuz" <<'PY'
          import gzip, struct, subprocess, sys
          from pathlib import Path

          p = Path(sys.argv[1])
          data = p.read_bytes()
          # Unwrap Stubble PE wrapper (.linux section) if present
          if data[:2] == b"MZ" and data[4:8] != b"zimg" and data[0x38:0x3c] != b"ARM\x64":
              pe_off = struct.unpack_from("<I", data, 0x3c)[0]
              if data[pe_off:pe_off+4] == b"PE\x00\x00":
                  num_sec = struct.unpack_from("<H", data, pe_off + 6)[0]
                  opt_sz = struct.unpack_from("<H", data, pe_off + 20)[0]
                  sec_off = pe_off + 24 + opt_sz
                  for i in range(num_sec):
                      s = data[sec_off + i*40 : sec_off + (i+1)*40]
                      if s[:8].rstrip(b"\x00") == b".linux":
                          _, _, rsz, rptr = struct.unpack_from("<IIII", s, 8)
                          data = data[rptr : rptr + rsz]
                          break
          if data[:2] == b"MZ" and data[4:8] == b"zimg":
              off, sz = struct.unpack_from("<II", data, 8)
              comp = data[24:28].rstrip(b"\x00").decode("ascii", "replace")
              payload = data[off : off + sz]
              if comp == "zstd":
                  data = subprocess.check_output(["zstd", "-dc"], input=payload)
              elif comp == "gzip":
                  data = gzip.decompress(payload)
              elif comp in ("xzkern", "xz"):
                  data = subprocess.check_output(["xz", "-dc"], input=payload)
              elif comp == "lz4":
                  data = subprocess.check_output(["lz4", "-dc"], input=payload)
              p.unlink()
              p.write_bytes(data)
          PY
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL_ARGS=(-accel kvm -cpu host)
          elif [ "${TARGET_ARCH}" = "arm64" ]; then
            ACCEL_ARGS=(-accel tcg -cpu max,pauth-impdef=on)
          else
            ACCEL_ARGS=(-accel tcg -cpu max)
          fi

          : > "$BOOT_LOG"
          if [ "${TARGET_ARCH}" = "amd64" ]; then
            qemu-system-x86_64 \
              -machine q35 "${ACCEL_ARGS[@]}" \
              -m 2560 -smp 4 -display none -monitor none \
              -serial "file:${BOOT_LOG}" \
              -cdrom "$ISO_PATH" \
              -kernel "$TMP_BOOT/vmlinuz" \
              -initrd "$TMP_BOOT/initrd" \
              -append "console=ttyS0,115200 locale=vi_VN.UTF-8 systemd.unit=multi-user.target noplymouth nosplash" &
          else
            qemu-system-aarch64 \
              -machine virt "${ACCEL_ARGS[@]}" \
              -m 2560 -smp 4 -display none -monitor none \
              -serial "file:${BOOT_LOG}" \
              -drive "if=none,id=cd,file=${ISO_PATH},media=cdrom,readonly=on" \
              -device virtio-scsi-pci,id=scsi0 \
              -device scsi-cd,bus=scsi0.0,drive=cd \
              -kernel "$TMP_BOOT/vmlinuz" \
              -initrd "$TMP_BOOT/initrd" \
              -append "console=ttyAMA0,115200 locale=vi_VN.UTF-8 systemd.unit=multi-user.target noplymouth nosplash" &
          fi
          QEMU_PID=$!

          DEADLINE=$((SECONDS + 420))
          BOOTED=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            if grep -qE "(File system layers are missing|Unable to find a medium|overlay mount failed|Kernel panic|Failed to start initrd-switch-root|Entering emergency mode|\(initramfs\))" "$BOOT_LOG" 2>/dev/null; then
              echo "ERROR: Live boot failure detected in QEMU serial log:" >&2
              tail -n 80 "$BOOT_LOG" >&2
              exit 1
            fi
            if grep -iEq "(Reached target .*Multi-User System|login:)" "$BOOT_LOG" 2>/dev/null; then
              BOOTED=1
              break
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "ERROR: QEMU exited unexpectedly before boot completed:" >&2
              tail -n 80 "$BOOT_LOG" >&2
              exit 1
            fi
            sleep 2
          done

          if [ "$BOOTED" -ne 1 ]; then
            echo "ERROR: Timed out (420s) waiting for live boot completion in QEMU:" >&2
            tail -n 80 "$BOOT_LOG" >&2
            exit 1
          fi

          kill "$QEMU_PID" 2>/dev/null || true
          QEMU_PID=""
          echo "QEMU live boot verification succeeded for ${{ matrix.arch }}."
          {
            echo "### QEMU Live Boot Verification (${{ matrix.arch }})"
            echo "- Result: Passed (default layered Casper stack -> Multi-User System)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record ISO checksum
        run: |
          ISO_PATH="iso-builder/NidoOS-desktop-${{ matrix.arch }}.iso"
          ISO_SIZE="$(du -h "$ISO_PATH" | cut -f1)"
          ISO_SHA="$(sha256sum "$ISO_PATH" | cut -d' ' -f1)"
          mkdir -p iso-builder/checksums
          printf '%s  NidoOS-desktop-%s.iso\n' "$ISO_SHA" "${{ matrix.arch }}" > "iso-builder/checksums/NidoOS-desktop-${{ matrix.arch }}.sha256"
          {
            echo "### NidoOS ISO (${{ matrix.arch }})"
            echo "- File: \`NidoOS-desktop-${{ matrix.arch }}.iso\`"
            echo "- Size: \`${ISO_SIZE}\`"
            echo "- SHA256: \`${ISO_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ISO to S3 CDN (if secrets configured)
        env:
          CDN_BUCKET: ${{ vars.CDN_BUCKET || 'nidoos-releases' }}
          CDN_PUBLIC_URL: ${{ vars.CDN_PUBLIC_URL }}
          RCLONE_CONFIG_CDN_TYPE: s3
          RCLONE_CONFIG_CDN_PROVIDER: Other
          RCLONE_CONFIG_CDN_REGION: auto
          RCLONE_CONFIG_CDN_ENDPOINT: ${{ secrets.CDN_S3_ENDPOINT }}
          RCLONE_CONFIG_CDN_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
          RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY: ${{ secrets.CDN_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_CDN_ACL: private
          RCLONE_CONFIG_CDN_NO_CHECK_BUCKET: "true"
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_CDN_ACCESS_KEY_ID:-}" ] || [ -z "${RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY:-}" ] || [ -z "${RCLONE_CONFIG_CDN_ENDPOINT:-}" ]; then
            echo "CDN credentials not configured; skipping S3 CDN upload."
            exit 0
          fi
          if ! command -v rclone >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rclone
          fi
          ISO_NAME="NidoOS-desktop-${{ matrix.arch }}.iso"
          ISO_PATH="iso-builder/${ISO_NAME}"
          SHA_PATH="iso-builder/checksums/NidoOS-desktop-${{ matrix.arch }}.sha256"
          PUB_BASE="${CDN_PUBLIC_URL%/}"
          TARGETS=("latest")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TARGETS+=("${GITHUB_REF_NAME}")
          fi
          for prefix in "${TARGETS[@]}"; do
            rclone copyto "$ISO_PATH" "cdn:${CDN_BUCKET}/${prefix}/${ISO_NAME}" \
              --s3-chunk-size 64M \
              --s3-upload-concurrency 8 \
              --s3-no-check-bucket \
              --header-upload "Content-Type: application/octet-stream" \
              --header-upload "Content-Disposition: attachment; filename=\"${ISO_NAME}\"" \
              --header-upload "Cache-Control: public, max-age=3600" \
              --stats 10s \
              --stats-one-line
            rclone copyto "$SHA_PATH" "cdn:${CDN_BUCKET}/${prefix}/NidoOS-desktop-${{ matrix.arch }}.sha256" \
              --s3-no-check-bucket \
              --header-upload "Content-Type: text/plain; charset=utf-8" \
              --header-upload "Cache-Control: no-cache"
            if [ -n "$PUB_BASE" ]; then
              echo "- Fast CDN (${prefix}): [${ISO_NAME}](${PUB_BASE}/${prefix}/${ISO_NAME})" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload ISO checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: nidoos-sha256-${{ matrix.arch }}
          path: iso-builder/checksums/NidoOS-desktop-${{ matrix.arch }}.sha256
          retention-days: 7

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: nidoos-iso-${{ matrix.arch }}
          path: iso-builder/NidoOS-desktop-${{ matrix.arch }}.iso
          compression-level: 0
          retention-days: 7

      - name: Upload static APT repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: nidoos-apt-repo-${{ matrix.arch }}
          path: apt-repo/**
          retention-days: 7

  sync-cdn-checksums:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    env:
      CDN_BUCKET: ${{ vars.CDN_BUCKET || 'nidoos-releases' }}
      CDN_PUBLIC_URL: ${{ vars.CDN_PUBLIC_URL }}
      RCLONE_CONFIG_CDN_TYPE: s3
      RCLONE_CONFIG_CDN_PROVIDER: Other
      RCLONE_CONFIG_CDN_REGION: auto
      RCLONE_CONFIG_CDN_ENDPOINT: ${{ secrets.CDN_S3_ENDPOINT }}
      RCLONE_CONFIG_CDN_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
      RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY: ${{ secrets.CDN_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CDN_ACL: private
      RCLONE_CONFIG_CDN_NO_CHECK_BUCKET: "true"
    steps:
      - name: Download ISO checksums
        uses: actions/download-artifact@v4
        with:
          pattern: nidoos-sha256-*
          path: cdn-checksums
          merge-multiple: true

      - name: Merge & upload latest/SHA256SUMS.txt to S3 CDN
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONFIG_CDN_ACCESS_KEY_ID:-}" ] || [ -z "${RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY:-}" ] || [ -z "${RCLONE_CONFIG_CDN_ENDPOINT:-}" ]; then
            echo "CDN credentials not configured; skipping latest/SHA256SUMS.txt sync."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rclone
          cd cdn-checksums
          # Seed with any existing remote latest/SHA256SUMS.txt so single-arch builds preserve the other arch
          if rclone copyto "cdn:${CDN_BUCKET}/latest/SHA256SUMS.txt" remote-existing.txt --s3-no-check-bucket 2>/dev/null; then
            true
          elif [ -n "${CDN_PUBLIC_URL:-}" ] && curl -fsSL "${CDN_PUBLIC_URL%/}/latest/SHA256SUMS.txt" -o remote-existing.txt 2>/dev/null; then
            true
          else
            : > remote-existing.txt
          fi
          python3 - <<'PY'
          from pathlib import Path
          entries: dict[str, str] = {}
          existing = Path("remote-existing.txt")
          if existing.is_file():
              for ln in existing.read_text(encoding="utf-8", errors="replace").splitlines():
                  parts = ln.split()
                  if len(parts) >= 2 and parts[1].endswith(".iso"):
                      entries[parts[1]] = f"{parts[0]}  {parts[1]}"
          for sha_file in sorted(Path(".").glob("NidoOS-desktop-*.sha256")):
              for ln in sha_file.read_text(encoding="utf-8", errors="replace").splitlines():
                  parts = ln.split()
                  if len(parts) >= 2:
                      entries[parts[1]] = f"{parts[0]}  {parts[1]}"
          out = "\n".join(entries[k] for k in sorted(entries)) + ("\n" if entries else "")
          Path("SHA256SUMS.txt").write_text(out, encoding="utf-8")
          PY
          test -s SHA256SUMS.txt
          cat SHA256SUMS.txt
          rclone copyto SHA256SUMS.txt "cdn:${CDN_BUCKET}/latest/SHA256SUMS.txt" \
            --s3-no-check-bucket \
            --header-upload "Content-Type: text/plain; charset=utf-8" \
            --header-upload "Cache-Control: no-cache"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    env:
      CDN_BUCKET: ${{ vars.CDN_BUCKET || 'nidoos-releases' }}
      CDN_PUBLIC_URL: ${{ vars.CDN_PUBLIC_URL }}
      RCLONE_CONFIG_CDN_TYPE: s3
      RCLONE_CONFIG_CDN_PROVIDER: Other
      RCLONE_CONFIG_CDN_REGION: auto
      RCLONE_CONFIG_CDN_ENDPOINT: ${{ secrets.CDN_S3_ENDPOINT }}
      RCLONE_CONFIG_CDN_ACCESS_KEY_ID: ${{ secrets.CDN_ACCESS_KEY_ID }}
      RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY: ${{ secrets.CDN_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CDN_ACL: private
      RCLONE_CONFIG_CDN_NO_CHECK_BUCKET: "true"
    steps:
      - name: Download ISO checksums
        uses: actions/download-artifact@v4
        with:
          pattern: nidoos-sha256-*
          path: release-assets
          merge-multiple: true

      - name: Assemble SHA256SUMS.txt & publish to S3 CDN
        run: |
          set -euo pipefail
          cd release-assets
          cat NidoOS-desktop-*.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ -n "${RCLONE_CONFIG_CDN_ACCESS_KEY_ID:-}" ] && [ -n "${RCLONE_CONFIG_CDN_SECRET_ACCESS_KEY:-}" ] && [ -n "${RCLONE_CONFIG_CDN_ENDPOINT:-}" ]; then
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends rclone
            for prefix in "latest" "${GITHUB_REF_NAME}"; do
              rclone copyto SHA256SUMS.txt "cdn:${CDN_BUCKET}/${prefix}/SHA256SUMS.txt" \
                --s3-no-check-bucket \
                --header-upload "Content-Type: text/plain; charset=utf-8" \
                --header-upload "Cache-Control: no-cache"
            done
          fi
          PUB_BASE="${CDN_PUBLIC_URL%/}"
          cat > RELEASE_BODY.md <<EOF
          ## NidoOS ${GITHUB_REF_NAME} (Ubuntu 26.04 LTS Base)

          Direct high-speed CDN downloads (GitHub Releases enforces a 2 GiB per-asset limit):

          - **amd64 (x86_64 PC/Laptop):** [NidoOS-desktop-amd64.iso](${PUB_BASE}/${GITHUB_REF_NAME}/NidoOS-desktop-amd64.iso)
          - **arm64 (Apple Silicon VM / ARM64):** [NidoOS-desktop-arm64.iso](${PUB_BASE}/${GITHUB_REF_NAME}/NidoOS-desktop-arm64.iso)
          - **Checksums:** [SHA256SUMS.txt](${PUB_BASE}/${GITHUB_REF_NAME}/SHA256SUMS.txt)

          \`\`\`sh
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

      - name: Publish GitHub Release (SHA256SUMS + CDN links)
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-assets/RELEASE_BODY.md
          files: |
            release-assets/SHA256SUMS.txt
