name: Verify NidoHub Packages & Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck dpkg-dev gcc make pkg-config libibus-1.0-dev libglib2.0-dev

      - name: Build & verify nido-ime-bridge from source
        run: |
          APT_GPG_KEY="" bash scripts/build_ime_bridge.sh --arch amd64 --native --out-dir packages/vendor

      - name: Run full verification suite
        run: make check

      - name: Test real dpkg installation on Ubuntu
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./packages/dist/nidoai-gateway_*_all.deb \
            ./packages/dist/nidoagent-cli_*_all.deb \
            ./packages/dist/nido-desktop-settings_*_all.deb \
            ./packages/dist/nido-hub_*_all.deb \
            ./packages/dist/nidooffice-cli_*_all.deb \
            ./packages/dist/nidooffice-desktop_*_all.deb
          nidoagent --version
          nidoai doctor
          nido-hub --self-test
          nido-security-verify --verify
          pkcs11-helper --self-test
          nidooffice --version
          test -x /usr/bin/nidooffice-desktop
          test -x /opt/NidoOffice/genoffice
          sudo apt-get update
          apt-cache policy vielotus | grep -q "ubuntu-nido-apt"
          apt-cache policy nidobox | grep -q "ubuntu-nido-apt"
          apt-cache policy nidooffice-desktop | grep -q "ubuntu-nido-apt"
          apt-cache policy nido-desktop | grep -q "ubuntu-nido-apt"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./packages/vendor/nido-ime-bridge_*_amd64.deb ./packages/dist/nido-desktop_*_all.deb
          /usr/lib/ibus/nido-ibus-vielotus --self-test
          dpkg --compare-versions "$(dpkg-query -W -f='${Version}' nidobox)" ge "1.5.0"
          nidobox --self-test
          dpkg -s nido-desktop >/dev/null
          dpkg -s nido-ime-bridge >/dev/null
          dpkg -s showtime >/dev/null 2>&1 || dpkg -s totem >/dev/null 2>&1
