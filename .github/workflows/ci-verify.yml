name: Verify NidoHub Packages & Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck dpkg-dev

      - name: Run full verification suite
        run: make check

      - name: Test real dpkg installation on Ubuntu
        run: |
          sudo apt-get install -y ./packages/dist/nidoai-gateway_0.1.0_all.deb \
            ./packages/dist/nidoagent-cli_0.1.0_all.deb \
            ./packages/dist/nido-desktop-settings_0.1.0_all.deb \
            ./packages/dist/nido-hub_0.1.0_all.deb \
            ./packages/dist/nidooffice-cli_0.1.0_all.deb
          nidoagent --version
          nidoai doctor
          nido-hub --self-test
          nidooffice --version
          sudo apt-get update
          apt-cache policy vielotus | grep -q "ubuntu-nido-apt"
          apt-cache policy nidobox | grep -q "ubuntu-nido-apt"
          sudo apt-get install -y --no-install-recommends nidobox
          nidobox --self-test
